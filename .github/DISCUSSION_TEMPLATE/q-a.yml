title: "[Q&A] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your question! Please check the [installation guide](https://minthcm.org/support/minthcm-installation-guide/) and existing discussions first.
        - Installation or upgrade problem? Use the **Installation & upgrade** category instead.
        - Found a bug? Please open an [issue](https://github.com/minthcm/minthcm/issues).
        - Want to chat in real time? Join our [Discord](https://discord.gg/zHu8AfCEVb).
  - type: input
    id: version
    attributes:
      label: MintHCM version
      description: Not sure? The version is stored in the file legacy/minthcm_version.php on your server.
      placeholder: "e.g. 4.0.6"
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: How do you run MintHCM?
      options:
        - MintHCM Cloud
        - Self-hosted (manual installation)
        - Docker
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: What are you trying to achieve? Be as specific as you can.
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you already tried?
      description: Docs you read, settings you changed, error messages you saw.
    validations:
      required: false
